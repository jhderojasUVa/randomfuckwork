name: Release & Version Update

# ============================================================================
# Workflow Triggers
# ============================================================================
# This workflow runs ONLY on successful test runs on main branch
on:
  workflow_run:
    workflows: ["Test & Publish to GCP"]
    types:
      - completed
    branches:
      - main

# ============================================================================
# Environment Variables
# ============================================================================
env:
  NODE_VERSION: 18

# ============================================================================
# Concurrency Settings
# ============================================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Job: Release Management
  # ============================================================================
  release:
    name: Semantic Release & GitHub Release
    runs-on: ubuntu-latest
    
    # Only run if the test workflow succeeded
    if: github.event.workflow_run.conclusion == 'success'
    
    # Permissions needed for semantic-release
    permissions:
      contents: write      # Push commits and tags
      pull-requests: write # Create PRs if needed
      id-token: write      # OIDC for deployments

    outputs:
      released: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}

    steps:
      # ========================================================================
      # Step 1: Checkout repository with full history
      # ========================================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for semantic-release to analyze commits
          fetch-depth: 0
          # Use GitHub token to authenticate
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================================
      # Step 2: Setup Node.js environment
      # ========================================================================
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      # ========================================================================
      # Step 3: Install dependencies
      # ========================================================================
      - name: 📦 Install dependencies
        run: |
          yarn install --frozen-lockfile
        env:
          CI: true

      # ========================================================================
      # Step 4: Configure Git user
      # ========================================================================
      - name: 🔧 Configure Git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # ========================================================================
      # Step 5: Run semantic-release
      # ========================================================================
      - name: 🚀 Run semantic-release
        id: semantic
        run: |
          npx semantic-release
        env:
          # GitHub token for authentication and release creation
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM token (optional, if publishing to npm)
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || '' }}

      # ========================================================================
      # Step 6: Display release information
      # ========================================================================
      - name: 📊 Release Summary
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo "✅ Release Published!"
          echo "================================"
          echo "Version: ${{ steps.semantic.outputs.new_release_version }}"
          echo "Tag: ${{ steps.semantic.outputs.new_release_git_tag }}"
          echo "Channel: ${{ steps.semantic.outputs.new_release_channel }}"
          echo ""
          echo "📝 Release Notes:"
          echo "${{ steps.semantic.outputs.new_release_notes }}"

      # ========================================================================
      # Step 7: Create deployment if release was published
      # ========================================================================
      - name: 📢 Release notification
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo "New release published: v${{ steps.semantic.outputs.new_release_version }}"
          echo "This triggers subsequent deployment workflows..."

      # ========================================================================
      # Step 8: No-release notification
      # ========================================================================
      - name: ℹ️  No changes for release
        if: steps.semantic.outputs.new_release_published != 'true'
        run: |
          echo "No changes detected that warrant a release."
          echo "Commit types (feat, fix, BREAKING CHANGE) are required for automatic releases."

      # ========================================================================
      # Step 9: Verify version update in package.json
      # ========================================================================
      - name: ✅ Verify version update
        if: always()
        run: |
          echo "Current package.json version:"
          cat package.json | grep -A1 '"version"'

# ============================================================================
# Workflow: Release Configuration Notes
# ============================================================================
# 
# This workflow uses semantic-release to automatically:
# 1. Analyze commit messages using conventional commits
# 2. Determine version bump (major.minor.patch)
# 3. Update package.json and package-lock.json
# 4. Create a git tag
# 5. Push tag and commits to repository
# 6. Create a GitHub release with release notes
#
# Conventional Commit Types:
# - feat: minor version bump (feature)
# - fix: patch version bump (bugfix)
# - BREAKING CHANGE: major version bump
#
# Commit Messages Should Follow:
# - feat(scope): description → bumps minor
# - fix(scope): description → bumps patch
# - feat(scope): description\n\nBREAKING CHANGE: → bumps major
#
# Configuration:
# - Semantic-release config can be customized in .releaserc.json
# - By default, it uses the repository field in package.json
# - Release notes are auto-generated from commit messages
#
# GitHub Token Scopes Required:
# - contents: write (push commits/tags, create releases)
# - pull-requests: write (create PRs for releases if configured)
# - id-token: write (OIDC authentication)
#
# ============================================================================
