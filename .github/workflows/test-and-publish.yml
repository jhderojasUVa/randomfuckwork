name: Test & Publish to GCP

# ============================================================================
# Workflow Triggers
# ============================================================================
# This workflow runs on:
# - Push events to the main branch
# - Pull request events
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# ============================================================================
# Environment Variables
# ============================================================================
# Configure these values in your GitHub repository settings
# (Settings > Secrets and variables > Actions > Variables)
env:
  # GCP Configuration
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
  
  # GCP Bucket Names (can be customized)
  GCP_TEST_RESULTS_BUCKET: gs://randomfuckwork-test-results-dev
  GCP_COVERAGE_REPORTS_BUCKET: gs://randomfuckwork-coverage-reports-dev
  
  # Node Configuration
  NODE_VERSION: 18

# ============================================================================
# Concurrency Settings
# ============================================================================
# Cancel in-progress workflows when a new workflow is triggered on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Test Execution and Report Generation
  # ============================================================================
  # This job runs first and must complete successfully before the release job
  # runs in this same workflow. It ensures that tests pass before any release
  # or publishing operations are performed on the main branch.
  test:
    name: Run Tests & Generate Reports
    runs-on: ubuntu-latest
    
    # Permissions required for OIDC token generation (Workload Identity Federation)
    permissions:
      id-token: write
      contents: read
    
    # Set step output values
    outputs:
      test-results-path: ${{ steps.test.outputs.test-results-path }}
      coverage-report-path: ${{ steps.test.outputs.coverage-report-path }}

    steps:
      # ========================================================================
      # Step 1: Checkout code
      # ========================================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for better diff/blame information
          fetch-depth: 0

      # ========================================================================
      # Step 2: Setup Node.js environment
      # ========================================================================
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'  # Cache yarn dependencies

      # ========================================================================
      # Step 3: Install dependencies
      # ========================================================================
      - name: 📦 Install dependencies
        run: |
          echo "Installing dependencies with yarn..."
          yarn install --frozen-lockfile
        env:
          # Ensure CI mode is enabled for stricter version matching
          CI: true

      # ========================================================================
      # Step 4: Run tests with coverage
      # ========================================================================
      - name: 🧪 Run tests with coverage
        id: test
        run: |
          echo "Running tests in headless/CI mode..."
          
          # Create directories for test reports and coverage
          mkdir -p test-reports coverage-reports
          
          # Run tests with coverage (headless mode for CI)
          # CI=true enables headless mode for react-scripts
          # --coverage generates coverage reports
          # --watchAll=false prevents watch mode
          # --json outputs in JSON format for machine parsing
          CI=true yarn test --coverage --watchAll=false --json --jsonOutputFile=test-reports/test-results.json || TEST_EXIT_CODE=$?
          
          # Generate JUnit XML format for integration with other tools
          # Note: Jest's json report can be converted to JUnit XML format
          # For now, we'll create a simple JUnit report from the json output
          yarn test --coverage --watchAll=false --json --jsonOutputFile=test-reports/full-results.json 2>/dev/null || true
          
          # Convert coverage reports to LCOV format (already generated by Jest)
          if [ -f coverage/lcov.info ]; then
            echo "✅ LCOV coverage report generated"
          fi
          
          # Generate HTML coverage report summary
          if [ -f coverage/index.html ]; then
            echo "✅ HTML coverage report generated"
          fi
          
          # Set outputs for downstream steps
          echo "test-results-path=test-reports/test-results.json" >> $GITHUB_OUTPUT
          echo "coverage-report-path=coverage/" >> $GITHUB_OUTPUT
          
          # Exit with test status
          exit ${TEST_EXIT_CODE:-0}
        env:
          CI: true
          # Disable interactive mode in Jest
          CI_MODE: true

      # ========================================================================
      # Step 5: Display test results summary
      # ========================================================================
      - name: 📊 Test Results Summary
        if: always()
        run: |
          echo "Test execution completed"
          if [ -f test-reports/test-results.json ]; then
            echo "Test report generated at: test-reports/test-results.json"
            # Show summary statistics
            echo "Test results:"
            cat test-reports/test-results.json | grep -E '"numPassedTests"|"numFailedTests"|"numTotalTests"' || true
          fi

      # ========================================================================
      # Step 6: Generate JUnit XML report (for CI integration)
      # ========================================================================
      - name: 📄 Generate JUnit XML Report
        if: always()
        continue-on-error: true
        run: |
          # Install jest-junit reporter
          npm install -g jest-junit 2>/dev/null || yarn add jest-junit 2>/dev/null || true
          
          # Note: In a production setup, you would typically configure jest-junit
          # in your Jest configuration. For now, we create a placeholder
          echo "Generating JUnit XML report..."
          
          # Create a basic JUnit XML structure from test results
          if [ -f test-reports/test-results.json ]; then
            node -e "
              const fs = require('fs');
              const results = JSON.parse(fs.readFileSync('test-reports/test-results.json', 'utf8'));
              const { numPassedTests, numFailedTests, numTotalTests } = results;
              
              const xml = \`<?xml version=\"1.0\" encoding=\"UTF-8\"?>
<testsuites tests=\"\${numTotalTests}\" failures=\"\${numFailedTests}\" time=\"\${results.testResults.reduce((sum, t) => sum + (t.perfStats?.duration || 0), 0) / 1000}\">
  <testsuite name=\"Jest Tests\" tests=\"\${numTotalTests}\" failures=\"\${numFailedTests}\" timestamp=\"\${new Date().toISOString()}\">
    \${results.testResults.map(t => \`
    <testcase classname=\"\${t.name}\" time=\"\${(t.perfStats?.duration || 0) / 1000}\" />
    \`).join('')}
  </testsuite>
</testsuites>\`;
              
              fs.writeFileSync('test-reports/junit.xml', xml);
              console.log('✅ JUnit XML report generated');
            \"
          fi

      # ========================================================================
      # Step 7: Upload test results as artifact
      # ========================================================================
      - name: 📤 Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-reports/
          retention-days: 30
          if-no-files-found: warn

      # ========================================================================
      # Step 8: Upload coverage reports as artifact
      # ========================================================================
      - name: 📤 Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30
          if-no-files-found: warn

  # ============================================================================
  # Job 2: Semantic Release & Version Management
  # ============================================================================
  # This job runs AFTER the test job completes successfully (needs: test).
  # It analyzes conventional commit history and:
  # - Bumps semantic version (major.minor.patch) in package.json
  # - Creates annotated git tag and GitHub release
  # - Generates release notes from commit messages
  #
  # CRITICAL: This must complete BEFORE publish-to-gcp starts,
  # ensuring artifacts have version tags before GCP upload.
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    
    # IMPORTANT: runs after test job completes
    needs: test

    # Permissions required for semantic-release and Git operations
    permissions:
      contents: write      # To create releases and push version updates
      issues: read         # To link issues in release notes
      pull-requests: read  # To link PRs in release notes
      id-token: write      # For OIDC token generation (optional)

    steps:
      # ========================================================================
      # Step 1: Checkout repository with full commit history
      # ========================================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history needed for semantic-release tag analysis
          fetch-depth: 0
          # Use a token with write permissions for pushing version updates
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========================================================================
      # Step 2: Setup Node.js environment
      # ========================================================================
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      # ========================================================================
      # Step 3: Install dependencies
      # ========================================================================
      - name: 📦 Install dependencies
        run: |
          echo "Installing dependencies with yarn..."
          yarn install --frozen-lockfile
        env:
          CI: true

      # ========================================================================
      # Step 4: Configure Git for semantic-release commits
      # ========================================================================
      # semantic-release needs Git credentials to push version commits
      - name: 🔧 Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action (semantic-release)"
          echo "✅ Git configured for automated commits"

      # ========================================================================
      # Step 5: Run semantic-release
      # ========================================================================
      # semantic-release will:
      # - Analyze commits since last release using conventional commits spec
      # - Determine version bump (major, minor, patch) or skip if no changes
      # - Update package.json version field
      # - Update package-lock.json
      # - Create annotated git tag (e.g., v1.2.3)
      # - Create GitHub release with auto-generated release notes
      # - Push commits and tags to repository
      #
      # The process is idempotent: if called twice, the second run detects
      # that the version is already released and does nothing.
      - name: 🚀 Run Semantic Release
        id: semantic-release
        run: |
          echo "Running semantic-release..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Run semantic-release with verbose logging for debugging
          yarn semantic-release --debug || RELEASE_EXIT_CODE=$?
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Capture new version if release succeeded
          if [ -f package.json ]; then
            NEW_VERSION=$(node -e "console.log(require('./package.json').version)")
            echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
            echo "✅ New version: ${NEW_VERSION}"
          else
            echo "⚠️  Unable to read new version from package.json"
          fi
          
          exit ${RELEASE_EXIT_CODE:-0}
        env:
          # semantic-release uses GITHUB_TOKEN for authentication
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Enable NPM plugin to update package.json
          npm_config_registry: https://registry.npmjs.org/

      # ========================================================================
      # Step 6: Verify version update
      # ========================================================================
      - name: ✅ Verify Version Update
        if: success()
        run: |
          echo "Release workflow completed successfully"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Display current version
          CURRENT_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "📦 Current version in package.json: ${CURRENT_VERSION}"
          
          # Display git tags (last 5)
          echo ""
          echo "📝 Recent git tags:"
          git tag --list --sort=-version:refname | head -5 | sed 's/^/  /'
          
          # Display git log (last 3 commits)
          echo ""
          echo "📋 Recent commits:"
          git log --oneline -3 | sed 's/^/  /'
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ========================================================================
      # Step 7: Handle workflow errors
      # ========================================================================
      - name: ❌ Handle Release Failure
        if: failure()
        run: |
          echo "❌ Release workflow failed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Possible reasons:"
          echo "  1. No new commits to analyze (no version bump needed)"
          echo "  2. Commits don't follow conventional commit format"
          echo "  3. Git configuration issues"
          echo "  4. Permission issues with GitHub token"
          echo ""
          echo "Note: This is not necessarily an error. Semantic-release"
          echo "skips releases when there are no changes to release."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ============================================================================
  # Job 3: Publish Test Results & Coverage to GCP
  # ============================================================================
  # This job runs AFTER the release job completes successfully (needs: release).
  # It uploads test reports and coverage reports to GCP buckets.
  #
  # Execution sequence ensures correct order:
  # 1. test job completes
  # 2. release job starts (waits for test via needs:)
  # 3. release job completes: version bump, git tag created
  # 4. publish-to-gcp job starts (waits for release via needs:)
  # 5. publish-to-gcp job completes: artifacts uploaded with version tag
  publish-to-gcp:
    name: Publish Test & Coverage Reports to GCP
    runs-on: ubuntu-latest
    
    # Only run on main branch pushes (not on PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    # Run after release job completes
    needs: release
    
    # Permissions for OIDC token generation
    permissions:
      id-token: write
      contents: read

    steps:
      # ========================================================================
      # Step 1: Checkout code
      # ========================================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ========================================================================
      # Step 2: Download test results artifact
      # ========================================================================
      - name: 📥 Download test results artifact
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-reports

      # ========================================================================
      # Step 3: Download coverage artifact
      # ========================================================================
      - name: 📥 Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: coverage

      # ========================================================================
      # Step 4: Authenticate with GCP using Workload Identity Federation
      # ========================================================================
      # This is the preferred method for GCP authentication in GitHub Actions
      # It uses OpenID Connect (OIDC) to issue short-lived tokens without secrets
      - name: 🔐 Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account_email: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}
          # Optional: Access token will be generated automatically
          token_format: 'access_token'
          access_token_lifetime: '3600s'  # 1 hour token lifetime
          create_credentials_file: true
        continue-on-error: false

      # ========================================================================
      # Step 5: Set up Cloud SDK
      # ========================================================================
      - name: 🔧 Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 469.0.0'
          project_id: ${{ env.GCP_PROJECT_ID }}

      # ========================================================================
      # Step 6: Create GCS paths with branch and timestamp
      # ========================================================================
      - name: 🗂️ Prepare GCS paths
        id: gcs-paths
        run: |
          # Generate timestamp and commit SHA for unique artifact paths
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          COMMIT_SHA=${{ github.sha }}
          SHORT_SHA=${COMMIT_SHA:0:8}
          BRANCH_NAME=$(echo ${{ github.ref }} | sed 's|refs/heads/||')
          
          # Create organized paths in GCS
          TEST_RESULTS_PATH="${BRANCH_NAME}/${TIMESTAMP}_${SHORT_SHA}/test-results"
          COVERAGE_PATH="${BRANCH_NAME}/${TIMESTAMP}_${SHORT_SHA}/coverage"
          
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "commit_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "test_results_path=${TEST_RESULTS_PATH}" >> $GITHUB_OUTPUT
          echo "coverage_path=${COVERAGE_PATH}" >> $GITHUB_OUTPUT
          
          echo "📍 GCS Path Info:"
          echo "  Branch: ${BRANCH_NAME}"
          echo "  Timestamp: ${TIMESTAMP}"
          echo "  Commit: ${SHORT_SHA}"
          echo "  Test Results Path: ${TEST_RESULTS_PATH}"
          echo "  Coverage Path: ${COVERAGE_PATH}"

      # ========================================================================
      # Step 7: Upload test results to GCP
      # ========================================================================
      - name: 📤 Upload test results to GCP
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: test-reports
          destination: ${{ env.GCP_TEST_RESULTS_BUCKET }}/${{ steps.gcs-paths.outputs.test_results_path }}
          parent: false
          # Make artifacts publicly readable (optional, modify as needed)
          # gzip: auto  # Automatically gzip .js, .css, .html, .json files
          predefinedAcl: 'private'  # Keep artifacts private
        continue-on-error: false

      # ========================================================================
      # Step 8: Upload coverage reports to GCP
      # ========================================================================
      - name: 📤 Upload coverage reports to GCP
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: coverage
          destination: ${{ env.GCP_COVERAGE_REPORTS_BUCKET }}/${{ steps.gcs-paths.outputs.coverage_path }}
          parent: false
          # Predefined ACL (set to 'private' for security, can be changed to 'publicRead' if needed)
          predefinedAcl: 'private'
        continue-on-error: false

      # ========================================================================
      # Step 9: Generate and upload index file for easy access
      # ========================================================================
      - name: 📝 Create GCS index file
        run: |
          # Create an index HTML file for easy browsing of artifacts
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Test Results & Coverage Reports</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 20px; }
                  h1 { color: #333; }
                  .section { margin: 20px 0; padding: 10px; background: #f5f5f5; border-radius: 5px; }
                  a { color: #0066cc; text-decoration: none; }
                  a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <h1>Test Results & Coverage Reports</h1>
              <div class="section">
                  <h2>Test Results</h2>
                  <p><a href="../test-results/test-results.json">View Test Results (JSON)</a></p>
                  <p><a href="../test-results/junit.xml">View Test Results (JUnit XML)</a></p>
              </div>
              <div class="section">
                  <h2>Coverage Reports</h2>
                  <p><a href="../coverage/index.html">View Coverage Report (HTML)</a></p>
                  <p><a href="../coverage/lcov.info">View Coverage Report (LCOV)</a></p>
              </div>
              <div class="section">
                  <p>Generated: ${{ github.event.head_commit.timestamp }}</p>
                  <p>Commit: <code>${{ steps.gcs-paths.outputs.commit_sha }}</code></p>
                  <p>Branch: <code>${{ github.ref }}</code></p>
              </div>
          </body>
          </html>
          EOF
          
          echo "✅ Index file created"

      # ========================================================================
      # Step 10: Upload index file to GCP
      # ========================================================================
      - name: 📤 Upload index file to GCP
        run: |
          gsutil cp index.html "${{ env.GCP_TEST_RESULTS_BUCKET }}/${{ steps.gcs-paths.outputs.test_results_path }}/index.html"
          gsutil cp index.html "${{ env.GCP_COVERAGE_REPORTS_BUCKET }}/${{ steps.gcs-paths.outputs.coverage_path }}/index.html"
          echo "✅ Index files uploaded to GCP"
        continue-on-error: true

      # ========================================================================
      # Step 11: Display upload summary
      # ========================================================================
      - name: 📊 Upload Summary
        run: |
          echo "📊 Artifacts Published to GCP"
          echo "================================"
          echo ""
          echo "Test Results Bucket:"
          echo "  Bucket: ${{ env.GCP_TEST_RESULTS_BUCKET }}"
          echo "  Path: ${{ steps.gcs-paths.outputs.test_results_path }}"
          echo "  URL: https://console.cloud.google.com/storage/browser/${{ env.GCP_TEST_RESULTS_BUCKET }}/${{ steps.gcs-paths.outputs.test_results_path }}"
          echo ""
          echo "Coverage Reports Bucket:"
          echo "  Bucket: ${{ env.GCP_COVERAGE_REPORTS_BUCKET }}"
          echo "  Path: ${{ steps.gcs-paths.outputs.coverage_path }}"
          echo "  URL: https://console.cloud.google.com/storage/browser/${{ env.GCP_COVERAGE_REPORTS_BUCKET }}/${{ steps.gcs-paths.outputs.coverage_path }}"
          echo ""
          echo "Artifacts organized by:"
          echo "  - Branch: ${{ github.ref }}"
          echo "  - Timestamp: ${{ steps.gcs-paths.outputs.timestamp }}"
          echo "  - Commit SHA: ${{ steps.gcs-paths.outputs.commit_sha }}"

      # ========================================================================
      # Step 12: Verify uploads
      # ========================================================================
      - name: ✅ Verify uploads to GCP
        run: |
          echo "Verifying uploads to GCP..."
          
          # List files in test results bucket
          echo "Test results files:"
          gsutil ls "${{ env.GCP_TEST_RESULTS_BUCKET }}/${{ steps.gcs-paths.outputs.test_results_path }}/" || echo "Note: Files may not be immediately visible"
          
          # List files in coverage bucket
          echo "Coverage files:"
          gsutil ls "${{ env.GCP_COVERAGE_REPORTS_BUCKET }}/${{ steps.gcs-paths.outputs.coverage_path }}/" || echo "Note: Files may not be immediately visible"
        continue-on-error: true

# ============================================================================
# Workflow Status Notifications
# ============================================================================
# Optional: Add notifications or other steps here
